apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signing-service-signing
  namespace: nutrient
spec:
  commonName: signing-service.nutrient.svc.cluster.local
  secretName: signing-service-signing-tls
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "signing-service"
    - "signing-service.nutrient"
    - "signing-service.nutrient.svc.cluster.local"
